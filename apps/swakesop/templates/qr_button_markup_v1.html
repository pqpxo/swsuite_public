<!-- version 2 -->
<div class="detail-actions detail-actions-three">
  <a
    href="{{ url_for('asset_qr', asset_key=asset.asset_key) }}"
    class="btn btn-small btn-secondary qr-button"
    data-qr-trigger
    data-qr-image="{{ url_for('asset_qr', asset_key=asset.asset_key) }}"
    data-qr-link="{{ public_url }}"
    data-qr-filename="{{ (asset.name or asset.asset_key)|replace(' ', '_')|lower }}_qr.png"
    onclick="return window.openQrModalFromLink(this, event);"
  >
    QR
  </a>

  <a
    href="{{ url_for('asset_edit', asset_id=asset.id) }}"
    class="btn btn-small btn-primary"
  >
    Edit
  </a>

  <form method="post" action="{{ url_for('asset_delete', asset_id=asset.id) }}" onsubmit="return confirm('Delete this asset?');">
    <button type="submit" class="btn btn-small btn-danger">
      Delete
    </button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/qr_modal_v2.js') }}"></script>
