# version 2
services:
  mini-qr-renderer:
    build:
      context: ./mini-qr-renderer
    container_name: mini-qr-renderer
    ports:
      - "8011:3000"
    environment:
      PORT: "3000"
      OUTPUT_SIZE: "240"
      QR_TEMPLATE_PATH: "/app/config/qr-code-config.json"
    volumes:
      - ./mini-qr-renderer/server.js:/app/server.js:ro
      - ./mini-qr-renderer/config/qr-code-config.json:/app/config/qr-code-config.json:ro
    restart: unless-stopped
