## version 1
services:
  homelab-inventory:
    build: .
    container_name: homelab-inventory
    ports:
      - "8085:8085"
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      APP_BASE_URL: "${APP_BASE_URL}"
      DATA_DIR: "/app/data"
      MINI_QR_RENDER_URL: "${MINI_QR_RENDER_URL}"
    volumes:
      - ${HOST_DATA_PATH}/data:/app/data
      - ${HOST_DATA_PATH}/templates:/app/templates
      - ${HOST_DATA_PATH}/static:/app/static
      - ${HOST_DATA_PATH}/app.py:/app/app.py
      - ${HOST_DATA_PATH}/app_category_fields_support_v2.py:/app/app_category_fields_support_v2.py
      - ${HOST_DATA_PATH}/seed_category_fields_v1.py:/app/seed_category_fields_v1.py
      - ${HOST_DATA_PATH}/category_field_seed_runtime_v1.py:/app/category_field_seed_runtime_v1.py
    depends_on:
      - mini-qr-renderer
    restart: unless-stopped

  mini-qr-renderer:
    build: ./mini-qr-renderer
    container_name: mini-qr-renderer
    ports:
      - "8011:3000"
    environment:
      PORT: "3000"
      OUTPUT_SIZE: "240"
      QR_TEMPLATE_PATH: "/app/config/qr-code-config.json"
    restart: unless-stopped
