{# version 4 #}
<header class="app-header">
  <a class="app-brand" href="{{ base }}/" aria-label="SWKick dashboard">
    <img class="brand-mark" src="{{ base }}/static/swkick-logo.png?v=1" alt="" width="52" height="52"/>
    <span class="brand-copy"><strong>SWKick</strong><small>Linux Update Dashboard</small></span>
  </a>
  <nav class="nav-links" aria-label="Main navigation">
    <a class="nav-link {{ 'is-current' if request.url.path == '/' else '' }}" href="{{ base }}/">Dashboard</a>
    <a class="nav-link {{ 'is-current' if request.url.path.startswith('/hosts') else '' }}" href="{{ base }}/hosts">Hosts</a>
    <a class="nav-link {{ 'is-current' if request.url.path.startswith('/groups') else '' }}" href="{{ base }}/groups">Groups</a>
    <a class="nav-link {{ 'is-current' if request.url.path.startswith('/credentials') else '' }}" href="{{ base }}/credentials">Credentials</a>
    <a class="nav-link {{ 'is-current' if request.url.path.startswith('/logs') else '' }}" href="{{ base }}/logs">Logs</a>
    <a class="nav-link {{ 'is-current' if request.url.path.startswith('/settings') else '' }}" href="{{ base }}/settings">Settings</a>
  </nav>
  <div class="header-actions">
    <button type="button" class="icon-button" id="theme-toggle" onclick="toggleTheme()"
            aria-label="Switch colour theme" title="Switch light/dark theme">
      <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"></path>
      </svg>
    </button>
    <a class="chip logout-link" href="{{ base }}/logout">Sign out</a>
  </div>
</header>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <a class="{{ 'is-current' if request.url.path == '/' else '' }}" href="{{ base }}/"><span>⌂</span>Overview</a>
  <a class="{{ 'is-current' if request.url.path.startswith('/hosts') else '' }}" href="{{ base }}/hosts"><span>▣</span>Hosts</a>
  <a class="{{ 'is-current' if request.url.path.startswith('/groups') else '' }}" href="{{ base }}/groups"><span>⊞</span>Groups</a>
  <a class="{{ 'is-current' if request.url.path.startswith('/credentials') else '' }}" href="{{ base }}/credentials"><span>⚿</span>Keys</a>
  <a class="{{ 'is-current' if request.url.path.startswith('/logs') else '' }}" href="{{ base }}/logs"><span>≡</span>Logs</a>
  <a class="{{ 'is-current' if request.url.path.startswith('/settings') else '' }}" href="{{ base }}/settings"><span>⚙</span>Settings</a>
</nav>
