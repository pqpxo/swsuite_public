# version 1
# SWKick's test suite (moved from pqpxo/kicker, where it ran at the repo root).
name: SWKick tests

on:
  pull_request:
    paths: ["apps/swkick/**", ".github/workflows/swkick-tests.yml"]
  push:
    branches: [main]
    paths: ["apps/swkick/**", ".github/workflows/swkick-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/swkick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/swkick/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_ui_v4.cjs
